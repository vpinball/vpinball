[configuration]
id = "Nixie"
name = "Nixie"
description = "Renders layouts of score displays (DMD, segments, images) on ancillary windows"
author = "VPX dev team"
version = "1.0"
link = "https://github.com/vpinball/vpinball"

[libraries]
windows.x86 = "plugin-nixie.dll"
windows.x64 = "plugin-nixie64.dll"
linux.x64 = "plugin-nixie.so"
linux.aarch64 = "plugin-nixie.so"
macos.x64 = "plugin-nixie.dylib"
macos.arm64 = "plugin-nixie.dylib"
