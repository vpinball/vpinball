name: vpx-test
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test (leave empty to test the selected branch)'
        required: false
        type: string

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.type }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025-vs2026, type: BGFX, platform: windows, arch: x64,   config: Release }
    steps:
      - uses: microsoft/setup-msbuild@v3
      - name: Install dependencies
        run: |
          /c/msys64/usr/bin/bash.exe -l -c "pacman -S --noconfirm make diffutils nasm bison git autoconf automake libtool"
          /c/msys64/usr/bin/bash.exe -l -c "pacman -S --noconfirm mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-libwinpthread mingw-w64-ucrt-x86_64-libiconv mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-tools"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.pr_number != '' && format('refs/pull/{0}/head', github.event.inputs.pr_number) || '' }}
      - name: Calculate external cache hash
        run: |
          echo "EXT_HASH=$(cat platforms/config.sh platforms/${{ matrix.platform }}-${{ matrix.arch }}/external.sh | sha256sum | cut -c1-12)" >> $GITHUB_ENV
      - name: Restore external cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: external
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.config }}-external-${{ env.EXT_HASH }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.config }}-external-
      - name: Build external cache
        run: |
          BUILD_TYPE=${{ matrix.config }} ./platforms/${{ matrix.platform }}-${{ matrix.arch }}/external.sh
      - name: Clean external cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          find external -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true
          find external -name "*.tar.gz" -delete 2>/dev/null || true
          find external \( -name "*.o" -o -name "*.obj" \) -delete 2>/dev/null || true
      - name: Save external cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: external
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.config }}-external-${{ env.EXT_HASH }}
      - name: Setup build tools (DX9)
        if: matrix.type == 'DX9'
        run: |
          # cmake can't find fxc.exe so copy one into a directory in the path
          cp "/c/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x86/fxc.exe" /mingw64/bin
      - name: Build vpx-test
        run: |
          cmake -DRENDERER=${{ matrix.type }} -DPLATFORM=${{ matrix.platform }} -DARCH=${{ matrix.arch }} -G "Visual Studio 18 2026" -A x64 -B build
          cmake --build build --config ${{ matrix.config }} --target vpx-test --parallel
      - name: Run headless tests
        working-directory: build/${{ matrix.config }}
        run: |
          # [render] tagged tests need a GPU/display: they are excluded, only headless tests run
          set +e
          ./VPXTest_${{ matrix.type }}64.exe --test-case-exclude="*[render]*"
          status=$?
          set -e
          cat test-assets/test_results.txt || true
          exit $status
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vpx-test-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.type }}-${{ matrix.config }}-results
          path: |
            build/${{ matrix.config }}/test-assets/test_results.txt
            build/${{ matrix.config }}/test-assets/*-diff.webp
